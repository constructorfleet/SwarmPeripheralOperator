version: "2"
run:
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # The integration harness exists to drive the docker CLI.
      - path: tests/integration/
        linters: [gosec]
        text: G204
formatters:
  enable:
    - gofmt
    - goimports
